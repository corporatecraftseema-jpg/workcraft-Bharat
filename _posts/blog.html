<!DOCTYPE html>
<html>
<head>
    <title>WorkCraft Bharat - Blog</title>
</head>
<body>
    <h1>WorkCraft Bharat Blog</h1>
    <div id="posts"></div>

    <script>
        fetch('https://api.github.com/repos/corporatecraftseema-jpg/workcraft-Bharat/contents/_posts')
            .then(response => response.json())
            .then(data => {
                let postsDiv = document.getElementById("posts");
                data.forEach(file => {
                    let link = document.createElement("a");
                    link.href = file.download_url;
                    link.innerText = file.name;
                    postsDiv.appendChild(link);
                    postsDiv.appendChild(document.createElement("br"));
                });
            });
    </script>
</body>
</html>
