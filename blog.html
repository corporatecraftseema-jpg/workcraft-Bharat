<!DOCTYPE html>
<html>
<head>
    <title>WorkCraft Bharat - Blog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
        }

        header {
            background: #0d1b2a;
            color: white;
            padding: 20px;
        }

        nav a {
            color: #fca311;
            margin-right: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 40px;
            max-width: 900px;
            margin: auto;
        }

        .post {
            background: white;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.05);
        }

        footer {
            background: #0d1b2a;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>WorkCraft Bharat</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="services.html">Services</a>
    </nav>
</header>

<div class="container">
    <h2>Insights & Corporate Reform Articles</h2>
    <div id="posts"></div>
</div>

<footer>
    © 2026 WorkCraft Bharat | India-Focused Corporate Reform
</footer>

<script>
fetch('https://api.github.com/repos/corporatecraftseema-jpg/workcraft-Bharat/contents/_posts')
.then(response => response.json())
.then(files => {
    let postsDiv = document.getElementById("posts");

    files.forEach(file => {
        fetch(file.download_url)
        .then(res => res.text())
        .then(content => {
            let postDiv = document.createElement("div");
            postDiv.className = "post";

            let titleMatch = content.match(/title:\s*"(.+)"/);
            let title = titleMatch ? titleMatch[1] : file.name;

            let body = content.split('---')[2];

            postDiv.innerHTML = `
                <h2>${title}</h2>
                <p>${body}</p>
            `;

            postsDiv.appendChild(postDiv);
        });
    });
});
</script>

</body>
</html>
